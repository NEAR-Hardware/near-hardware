; NEAR Checkout firmware for the Waveshare ESP32-S3-Touch-LCD-3.5 (see BOARD.md).
; No dedicated PlatformIO board id exists for this board: esp32-s3-devkitc-1
; with 16 MB QIO flash and 8 MB octal PSRAM overrides.
[env:checkout]
platform = espressif32@8.0.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=0
    -DARDUINOJSON_USE_LONG_LONG=1
    -DARDUINOJSON_USE_DOUBLE=1
    -Wno-unused-variable
monitor_speed = 115200
upload_port = /dev/cu.usbmodem101
monitor_port = /dev/cu.usbmodem101
lib_deps =
    bblanchon/ArduinoJson@7.4.3
