; NEAR hardware wallet firmware for the Waveshare ESP32-S3-Touch-AMOLED-2.06 watch.
; Board settings copied from the working esp32-watch project (see BOARD.md).
; One network per build: `pio run -e testnet` (default) or `pio run -e mainnet`.
; The watch reports it in "info" and refuses to sign for any other network.
[platformio]
default_envs = testnet

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 32MB
board_build.partitions = default_16MB.csv
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=0
    -Wno-unused-variable
monitor_speed = 115200
upload_port = /dev/cu.usbmodem101
monitor_port = /dev/cu.usbmodem101
lib_deps =
    bblanchon/ArduinoJson@^7.4.2

[env:testnet]

; Demo-grade on mainnet too: flash encryption and secure boot stay off (README).
[env:mainnet]
build_flags =
    ${env.build_flags}
    -DNEAR_MAINNET
