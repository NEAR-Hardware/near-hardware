appId: com.nearhardware.desktop
productName: NEAR Hardware
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!scripts/*'
  # The Agent SDK's bundled Claude Code binaries; chats run the user's installed CLI
  - '!**/node_modules/@anthropic-ai/claude-agent-sdk-*/**'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
win:
  executableName: near-hardware
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
# PlatformIO and the coding agents aren't bundled: the app's setup installs them
# on first launch, so the download stays small.
mac:
  target:
    - target: dmg
      arch: arm64
    # install.sh downloads the zip
    - target: zip
      arch: arm64
  # Stable names so releases/latest/download/<name> always points at the newest build
  artifactName: NEAR-Hardware-mac-${arch}.${ext}
  category: public.app-category.developer-tools
  minimumSystemVersion: '12.0'
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Shown in macOS's permission prompts. Agents run inside the app, so their
  # file access is asked for in the app's name.
  extendInfo:
    NSDocumentsFolderUsageDescription: Your hardware projects are kept in Documents › NEAR Hardware. NEAR Hardware and the coding agent it runs read and write project files there.
    NSDesktopFolderUsageDescription: Lets NEAR Hardware and its coding agent open projects and files you keep on the Desktop.
    NSDownloadsFolderUsageDescription: Lets NEAR Hardware and its coding agent use files you've downloaded, like board examples and datasheets.
    NSRemovableVolumesUsageDescription: Lets NEAR Hardware open projects stored on an external drive.
    NSNetworkVolumesUsageDescription: Lets NEAR Hardware open projects stored on a network drive.
# Signed with a Developer ID and notarized when APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD
# and APPLE_TEAM_ID are set; see scripts/build-mac.mjs
dmg:
  title: ${productName}
  window:
    width: 540
    height: 380
  contents:
    - x: 140
      y: 190
    - x: 400
      y: 190
      type: link
      path: /Applications
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: github
  owner: NEAR-Hardware
  repo: near-hardware
